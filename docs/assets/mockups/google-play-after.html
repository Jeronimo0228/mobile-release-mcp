<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Play Console — Production rollout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Google Sans", Roboto, Arial, sans-serif; background: #f8f9fa; color: #202124; width: 3840px; height: 2160px; display: flex; }
    .topbar { position: absolute; top: 0; left: 0; right: 0; height: 96px; background: #fff; border-bottom: 1px solid #dadce0; display: flex; align-items: center; padding: 0 48px; font-size: 30px; font-weight: 500; gap: 16px; }
    .logo { width: 40px; height: 40px; background: #01875f; border-radius: 8px; }
    .sidebar { width: 380px; margin-top: 96px; background: #fff; border-right: 1px solid #dadce0; padding: 24px 0; }
    .sidebar div { padding: 18px 36px; font-size: 24px; color: #5f6368; }
    .sidebar div.active { background: #e8f0fe; color: #1a73e8; font-weight: 500; border-left: 4px solid #1a73e8; }
    .main { flex: 1; margin-top: 96px; padding: 48px 64px; }
    h1 { font-size: 48px; font-weight: 400; margin-bottom: 40px; }
    .card { background: #fff; border: 1px solid #dadce0; border-radius: 12px; padding: 36px; max-width: 1500px; box-shadow: 0 1px 3px rgba(60,64,67,.15); }
    .bar-wrap { background: #e8eaed; border-radius: 999px; height: 48px; margin: 32px 0; overflow: hidden; }
    .bar { background: linear-gradient(90deg,#1a73e8,#34a853); height: 100%; width: 10%; border-radius: 999px; }
    .label { font-size: 28px; color: #5f6368; }
    .strong { font-size: 32px; font-weight: 500; color: #137333; margin-top: 16px; }
    .overlay { position: absolute; bottom: 48px; right: 64px; background: #137333; color: #fff; padding: 24px 40px; border-radius: 8px; font-size: 28px; }
  </style>
</head>
<body>
  <div class="topbar"><div class="logo"></div> Google Play Console · Production</div>
  <nav class="sidebar"><div>Testing</div><div class="active">Production</div></nav>
  <main class="main">
    <h1>After StorePilot: staged rollout</h1>
    <section class="card">
      <p class="label">Release 13 · version code 13</p>
      <div class="bar-wrap"><div class="bar"></div></div>
      <p class="strong">10% of users · inProgress · promoted from internal</p>
      <p class="label" style="margin-top:24px;">Triggered by: configure_rollout / execute_release_intent</p>
    </section>
  </main>
  <div class="overlay">Dry-run first → confirm → ship</div>
</body>
</html>
