<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StorePilot</title>
  <style>
    body {
      margin: 0; width: 3840px; height: 2160px;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d1117 100%);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    h1 { font-size: 120px; font-weight: 700; margin-bottom: 24px; letter-spacing: -2px; }
    .tag { font-size: 48px; color: #a5b4fc; margin-bottom: 64px; }
    .line { font-size: 36px; color: #94a3b8; max-width: 2400px; line-height: 1.5; }
    .stores { display: flex; gap: 48px; margin-top: 80px; font-size: 32px; color: #cbd5e1; }
    .pill { background: rgba(99,102,241,.25); border: 1px solid #6366f1; padding: 16px 32px; border-radius: 999px; }
  </style>
</head>
<body>
  <h1>StorePilot</h1>
  <p class="tag">storepilot-mcp · v1.1</p>
  <p class="line">Release orchestration for AI agents — snapshot, blockers, dry-run intents<br/>App Store Connect + Google Play</p>
  <div class="stores">
    <span class="pill"> App Store Connect</span>
    <span class="pill"> Google Play Console</span>
  </div>
</body>
</html>
