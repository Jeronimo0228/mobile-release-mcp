<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>App Store Connect — Plazario ready</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background: #f5f5f7; color: #1d1d1f; width: 3840px; height: 2160px; display: flex; }
    .topbar { position: absolute; top: 0; left: 0; right: 0; height: 88px; background: #fff; border-bottom: 1px solid #d2d2d7; display: flex; align-items: center; padding: 0 48px; font-size: 28px; font-weight: 600; }
    .sidebar { width: 420px; margin-top: 88px; background: #fafafa; border-right: 1px solid #d2d2d7; padding: 40px 0; height: calc(2160px - 88px); }
    .sidebar a { display: block; padding: 16px 40px; font-size: 26px; color: #1d1d1f; text-decoration: none; }
    .sidebar a.active { background: #e8f4ff; font-weight: 600; border-left: 4px solid #0071e3; }
    .main { flex: 1; margin-top: 88px; padding: 56px 72px; }
    .badge { display: inline-block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 10px 20px; border-radius: 8px; font-size: 24px; font-weight: 600; margin-bottom: 32px; }
    h1 { font-size: 52px; font-weight: 700; margin-bottom: 48px; }
    .card { background: #fff; border: 1px solid #d2d2d7; border-radius: 16px; padding: 40px; margin-bottom: 32px; max-width: 1400px; }
    .build { display: flex; align-items: center; gap: 28px; font-size: 28px; }
    .icon { width: 96px; height: 96px; background: linear-gradient(135deg,#5856d6,#007aff); border-radius: 22px; }
    .ok { color: #34c759; font-weight: 600; font-size: 26px; margin-top: 16px; }
    .overlay { position: absolute; bottom: 48px; right: 72px; background: rgba(52,199,89,.92); color: #fff; padding: 24px 40px; border-radius: 12px; font-size: 28px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="topbar">App Store Connect · Plazario 1.0</div>
  <nav class="sidebar"><a class="active">iOS App · Version 1.0</a><a>TestFlight</a></nav>
  <main class="main">
    <div class="badge">Ready to Submit</div>
    <h1>After StorePilot: build assigned</h1>
    <section class="card">
      <div class="build">
        <div class="icon"></div>
        <div>
          <strong>Build 1.0 (14)</strong><br/>
          Uploaded via EAS · VALID · Phased release 10%
        </div>
      </div>
      <p class="ok">✓ Content rights · ✓ Export compliance · ✓ es-CO screenshots</p>
    </section>
  </main>
  <div class="overlay">execute_release_intent → submit_for_review</div>
</body>
</html>
