name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630beaae6b7cb986ddca1379b # v4.2.2

      - uses: actions/setup-node@39370e3970afc605803b4655a1c798226b75ea64 # v4.1.0
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
